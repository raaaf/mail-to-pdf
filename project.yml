name: MailToPDF
options:
  bundleIdPrefix: de.rafaelalex
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true

targets:
  MailToPDF:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.rafaelalex.MailToPDF
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSAppleEventsUsageDescription: "MailToPDF liest die ausgewählte E-Mail aus Mail, um sie als PDF zu speichern."
        INFOPLIST_KEY_LSUIElement: YES
        CODE_SIGN_ENTITLEMENTS: App/MailToPDF.entitlements
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: YES
        ENABLE_HARDENED_RUNTIME: NO
        SWIFT_VERSION: "6.0"

  MailToPDFTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: AppTests
      - path: Tests/Fixtures
        buildPhase: resources
    dependencies:
      - target: MailToPDF
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"

schemes:
  MailToPDF:
    build:
      targets:
        MailToPDF: all
    test:
      targets:
        - MailToPDFTests
